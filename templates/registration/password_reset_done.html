{% extends 'main.html' %}
{% block content %}
<main class="auth layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <h3>Check your email</h3>
        </div>
      </div>
      <div class="layout__body" style="text-align:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 1.6rem;display:block;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <p style="font-size:1.5rem;color:var(--color-text);font-weight:500;">Reset link sent!</p>
        <p style="color:var(--color-text-secondary);font-size:1.4rem;margin-top:0.8rem;">If an account exists with that email, you'll receive a password reset link shortly.</p>
        <a href="{% url 'login' %}" class="btn btn--main" style="margin-top:2rem;">Back to Login</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
