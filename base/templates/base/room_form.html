{% extends 'main.html' %}
{% block content %}
<main class="create-room layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <a href="{% url 'home' %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <h3>{% if room %}Update{% else %}Create{% endif %} Study Room</h3>
        </div>
      </div>
      <div class="layout__body">
        <form class="form" action="" method="POST">
          {% csrf_token %}

          <div class="form__group">
            <label for="room_name">Room Name</label>
            <input required type="text" name="name" id="room_name" value="{{room.name}}" placeholder="e.g. Python beginners" />
          </div>

          <div class="form__group">
            <label for="room_description">Description <span style="color:var(--color-text-muted);font-weight:400;">(optional)</span></label>
            <textarea name="description" id="room_description" placeholder="What will you study in this room?">{{room.description}}</textarea>
          </div>

          <div class="form__group">
            <label for="tags-input">Tags</label>
            <div class="tags-input-wrapper">
              <div class="tags-display" id="tags-display"></div>
              <input
                type="text"
                id="tags-input"
                placeholder="Type a tag and press Enter or comma..."
                autocomplete="off"
                list="topic-suggestions"
              />
              <datalist id="topic-suggestions">
                {% for topic in topics %}
                <option value="{{topic.name}}">
                {% endfor %}
              </datalist>
            </div>
            <input type="hidden" name="tags" id="tags-hidden" value="{{existing_tags}}" />
            <p style="font-size:1.2rem;color:var(--color-text-muted);margin-top:0.4rem;">Separate tags with commas or Enter. e.g. python, algorithms, web</p>
          </div>

          <div class="form__action">
            <a class="btn btn--dark" href="{% url 'home' %}">Cancel</a>
            <button class="btn btn--main" type="submit">{% if room %}Save Changes{% else %}Create Room{% endif %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  const display = document.getElementById('tags-display');
  const input = document.getElementById('tags-input');
  const hidden = document.getElementById('tags-hidden');

  let tags = hidden.value ? hidden.value.split(',').map(t => t.trim()).filter(Boolean) : [];

  function render() {
    display.innerHTML = '';
    tags.forEach((tag, i) => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerHTML = `${tag} <button type="button" data-i="${i}" aria-label="Remove ${tag}">×</button>`;
      chip.querySelector('button').addEventListener('click', function () {
        tags.splice(parseInt(this.dataset.i), 1);
        render();
      });
      display.appendChild(chip);
    });
    hidden.value = tags.join(', ');
  }

  function addTag(val) {
    const t = val.trim().toLowerCase();
    if (t && !tags.includes(t)) {
      tags.push(t);
      render();
    }
    input.value = '';
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      addTag(this.value.replace(',', ''));
    }
  });

  input.addEventListener('blur', function () {
    if (this.value.trim()) addTag(this.value);
  });

  render();
})();
</script>
{% endblock %}
