{% extends 'main.html' %}
{% block content %}
<main class="auth layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <h3>Password Reset Complete</h3>
        </div>
      </div>
      <div class="layout__body" style="text-align:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 1.6rem;display:block;"><polyline points="20 6 9 17 4 12"/></svg>
        <p style="font-size:1.5rem;color:var(--color-text);font-weight:500;">Password updated!</p>
        <p style="color:var(--color-text-secondary);font-size:1.4rem;margin-top:0.8rem;">Your password has been set. You can now log in.</p>
        <a href="{% url 'login' %}" class="btn btn--main" style="margin-top:2rem;">Log In</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
