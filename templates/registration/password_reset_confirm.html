{% extends 'main.html' %}
{% block content %}
<main class="auth layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <h3>Set New Password</h3>
        </div>
      </div>
      <div class="layout__body">
        {% if validlink %}
        <form class="form" method="POST">
          {% csrf_token %}
          <div class="form__group">
            <label for="id_new_password1">New password</label>
            <input type="password" name="new_password1" id="id_new_password1" required />
          </div>
          <div class="form__group">
            <label for="id_new_password2">Confirm new password</label>
            <input type="password" name="new_password2" id="id_new_password2" required />
          </div>
          <div class="form__action">
            <button class="btn btn--main" type="submit">Set Password</button>
          </div>
        </form>
        {% else %}
        <div style="text-align:center;padding:2rem 0;">
          <p style="color:var(--color-error);font-size:1.4rem;">This reset link is invalid or has expired.</p>
          <a href="{% url 'password_reset' %}" class="btn btn--main" style="margin-top:1.6rem;">Request a new link</a>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</main>
{% endblock %}
