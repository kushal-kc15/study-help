<div class="activities">
  <h2>Recent Activities</h2>
  {% for message in room_messages %}
  <div class="activities__box">
    <div class="activities__boxHeader">
      <a href="{% url 'user-profile' message.user.id %}">
        <div class="avatar avatar--small">
          <img src="{{message.user.avatar.url}}" alt="{{message.user.username}}" />
        </div>
        <p>
          @{{ message.user.username }}
          <span>{{ message.created|timesince }} ago</span>
        </p>
      </a>
      {% if request.user == message.user %}
      <a href="{% url 'delete-message' message.id %}" class="thread__delete">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </a>
      {% endif %}
    </div>
    <div class="activities__boxContent">
      <p>replied to post "<a href="{% url 'room' message.room.id %}">{{message.room}}</a>"</p>
      <div class="activities__boxRoomContent">{{message.body}}</div>
    </div>
  </div>
  {% endfor %}
</div>
