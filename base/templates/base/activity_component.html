<div class="activities">
  <h2>Active Now</h2>
  <div class="active-rooms">
    {% for room in active_rooms %}
    <a href="{% url 'room' room.id %}" class="active-room">
      <div class="active-room__info">
        <span class="active-room__name">{{ room.name }}</span>
        <span class="active-room__meta">
          {% if room.topic %}{{ room.topic.name }} · {% endif %}
          {{ room.participants.count }} joined
        </span>
      </div>
      <span class="active-room__dot"></span>
    </a>
    {% empty %}
    <p class="active-rooms__empty">No activity yet.</p>
    {% endfor %}
  </div>
  <a href="{% url 'home' %}?tab=trending" class="active-rooms__more">See trending rooms →</a>
</div>
