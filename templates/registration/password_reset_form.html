{% extends 'main.html' %}
{% block content %}
<main class="auth layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <a href="{% url 'login' %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <h3>Reset Password</h3>
        </div>
      </div>
      <div class="layout__body">
        <p style="color:var(--color-text-secondary);font-size:1.4rem;margin-bottom:2rem;">Enter your email and we'll send you a link to reset your password.</p>
        <form class="form" method="POST">
          {% csrf_token %}
          <div class="form__group">
            <label for="id_email">Email address</label>
            <input type="email" name="email" id="id_email" placeholder="your@email.com" required />
          </div>
          <div class="form__action">
            <button class="btn btn--main" type="submit">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
