{% extends 'main.html' %}
{% block content %}
<main class="create-room layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <a href="{% url 'home' %}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <h3>Browse Topics</h3>
        </div>
      </div>

      <div class="layout__body">
        <form action="" method="get" class="header__search" style="max-width:100%;margin-bottom:2rem;">
          <label>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input name="q" placeholder="Search for topics..." aria-label="Search topics" />
          </label>
        </form>

        <div class="topics-list" style="border:none;padding:0;">
          <a href="{% url 'home' %}" class="active">All <span>{{topics.count}}</span></a>
          {% for topic in topics %}
          <a href="{% url 'home' %}?q={{topic.name}}">{{topic.name}} <span>{{topic.room_set.all.count}}</span></a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
